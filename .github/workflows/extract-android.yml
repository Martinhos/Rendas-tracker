name: Extract ZIP on Push

on:
  push:
    branches:
      - main

jobs:
  extract-zip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP file
        run: |
          if [ -f "GestorImobiliario-android.zip" ]; then
            unzip -o GestorImobiliario-android.zip -d GestorImobiliario-android/
            echo "ZIP extracted successfully."
          else
            echo "ZIP file not found."
            exit 1
          fi

      - name: Upload extracted files
        uses: actions/upload-artifact@v4
        with:
          name: extracted-files
          path: GestorImobiliario-android/
          retention-days: 7