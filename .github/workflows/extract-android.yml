name: Extract Android ZIP

on:
  push:
    branches:
      - main

jobs:
  extract-zip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check if ZIP file exists
        id: check_zip
        run: |
          if [ -f "GestorImobiliario-android.zip" ]; then
            echo "ZIP file exists"
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "ZIP file does not exist"
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Extract ZIP file
        if: steps.check_zip.outputs.exists == 'true'
        run: |
          unzip -o GestorImobiliario-android.zip -d GestorImobiliario-android/
          ls -la GestorImobiliario-android/

      - name: Upload extracted files as artifact
        if: steps.check_zip.outputs.exists == 'true'
        uses: actions/upload-artifact@v3
        with:
          name: extracted-android-files
          path: GestorImobiliario-android/