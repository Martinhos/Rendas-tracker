name: Extract Android ZIP on Push

on:
  push:
    branches: [ "main" ]

jobs:
  extract-zip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download ZIP file
        run: |
          if [ -f "GestorImobiliario-android.zip" ]; then
            echo "ZIP file found."
          else
            echo "Error: GestorImobiliario-android.zip not found!"
            exit 1
          fi

      - name: Extract ZIP file
        run: |
          unzip -o GestorImobiliario-android.zip -d GestorImobiliario-android

      - name: Upload extracted files
        uses: actions/upload-artifact@v4
        with:
          name: extracted-android-files
          path: GestorImobiliario-android/
          retention-days: 7